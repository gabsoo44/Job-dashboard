<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mes candidatures</title>
<style>
  :root {
    --bg:#f7f7f5; --card:#fff; --text:#1c1c1a; --muted:#6b6b66; --line:#e4e4df;
    --s-Offre:#2e7d32; --s-Entretien:#43a047; --s-En-cours:#1e88e5; --s-À-relancer:#ef6c00;
    --s-Relancée:#f9a825; --s-Envoyée:#757575; --s-Sans-réponse:#9e9e9e; --s-Refus:#d32f2f; --s-Incomplète:#8d6e63;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161614; --card:#201f1d; --text:#ecebe6; --muted:#9a9a93; --line:#33322f; }
  }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.85rem; margin-bottom:20px; }
  .stats { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px;
          padding:6px 12px; cursor:pointer; font:inherit; font-size:.85rem; }
  .chip[aria-pressed="true"] { border-color:var(--c, var(--text)); box-shadow:inset 0 0 0 1px var(--c, var(--text)); }
  .chip b { color:var(--c, var(--text)); }
  .tools { display:flex; gap:8px; margin-bottom:12px; }
  input[type=search] { flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:8px;
                       background:var(--card); color:var(--text); font:inherit; }
  .table { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .row { display:grid; grid-template-columns:2fr 2fr 1fr 1fr 110px; gap:12px; padding:12px 16px;
         border-top:1px solid var(--line); align-items:center; }
  .row.head { border-top:0; color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; cursor:default; }
  .row.head span[data-sort] { cursor:pointer; }
  .co { font-weight:600; } .muted { color:var(--muted); font-size:.85rem; }
  .badge { justify-self:start; padding:3px 10px; border-radius:999px; font-size:.78rem; font-weight:600;
           color:var(--c); background:color-mix(in srgb, var(--c) 14%, transparent); }
  details summary { cursor:pointer; list-style:none; } details summary::-webkit-details-marker { display:none; }
  .hist { grid-column:1/-1; font-size:.82rem; color:var(--muted); padding-top:6px; }
  .hist li { margin:2px 0; } a { color:inherit; }
  .empty { padding:32px; text-align:center; color:var(--muted); }
  @media (max-width:720px) {
    .row { grid-template-columns:1fr auto; } .row.head { display:none; }
    .row .hide-m { display:none; }
  }
</style>
</head>
<body>
<main>
  <h1>Mes candidatures</h1>
  <form id="lock" class="tools">
    <input type="password" id="pw" placeholder="Mot de passe" autocomplete="current-password" required autofocus>
    <button class="chip" type="submit">Déverrouiller</button>
  </form>
  <div class="muted" id="err" role="alert"></div>
  <div id="app" hidden>
    <div class="sub" id="sub"></div>
    <div class="stats" id="stats"></div>
    <div class="tools"><input type="search" id="q" placeholder="Rechercher une entreprise, un poste, une plateforme…"></div>
    <div class="table" id="table"></div>
  </div>
</main>
<script>
const STATUS_ORDER = ["Offre","Entretien","En cours","À relancer","Relancée","Envoyée","Sans réponse","Refus","Incomplète"];
const color = s => `var(--s-${s.replace(/ /g, "-")})`;
const fmt = d => d ? new Date(d).toLocaleDateString("fr-FR") : "—";
let apps = [], filter = null, query = "", sortKey = "applied_on", sortDir = -1;

const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.flat().forEach(k => n.append(k));
  return n;
};

// Data is AES-256-GCM encrypted (key = PBKDF2-SHA256 of the password); decrypted only in this browser.
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(blob, password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(blob.salt), iterations: blob.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function unlock(password) {
  const blob = await fetch("data/store.enc.json", { cache: "no-store" }).then(r => {
    if (!r.ok) throw new Error("Aucune donnée pour l'instant (lance la synchro une première fois).");
    return r.json();
  });
  let data;
  try { data = await decrypt(blob, password); } catch { throw new Error("Mot de passe incorrect."); }
  try { sessionStorage.setItem("pw", password); } catch {}
  apps = data.applications;
  document.getElementById("lock").hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("sub").textContent =
    `${apps.length} candidatures · dernière mise à jour ${data.generated_at ? new Date(data.generated_at).toLocaleString("fr-FR") : "—"}`;
  render();
}

document.getElementById("lock").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  try { await unlock(document.getElementById("pw").value); } catch (ex) { err.textContent = ex.message; }
});

let saved = null;
try { saved = sessionStorage.getItem("pw"); } catch {}
if (saved) unlock(saved).catch(() => {});

function render() {
  const counts = Object.fromEntries(STATUS_ORDER.map(s => [s, apps.filter(a => a.status === s).length]));
  const stats = document.getElementById("stats");
  stats.replaceChildren(...STATUS_ORDER.filter(s => counts[s]).map(s => {
    const b = el("button", { className: "chip", ariaPressed: filter === s }, `${s} `, el("b", {}, counts[s]));
    b.style.setProperty("--c", color(s));
    b.onclick = () => { filter = filter === s ? null : s; render(); };
    return b;
  }));

  const q = query.toLowerCase();
  const rows = apps
    .filter(a => (!filter || a.status === filter) &&
      (!q || [a.company, a.title, a.platform, a.location].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => {
      const va = sortKey === "status" ? STATUS_ORDER.indexOf(a.status) : (a[sortKey] || "");
      const vb = sortKey === "status" ? STATUS_ORDER.indexOf(b.status) : (b[sortKey] || "");
      return (va > vb ? 1 : va < vb ? -1 : 0) * sortDir;
    });

  const th = (label, key, cls = "") => el("span", { textContent: label, className: cls, onclick: () => {
    sortDir = sortKey === key ? -sortDir : 1; sortKey = key; render(); } });
  const head = el("div", { className: "row head" },
    ...[["Entreprise","company"],["Poste","title"],["Plateforme","platform","hide-m"],["Postulé le","applied_on","hide-m"],["Statut","status"]]
      .map(([l, k, c]) => { const s = th(l, k, c); s.dataset.sort = k; return s; }));

  const table = document.getElementById("table");
  table.replaceChildren(head);
  if (!rows.length) return table.append(el("div", { className: "empty" }, "Aucune candidature."));

  rows.forEach(a => {
    const badge = el("span", { className: "badge" }, a.status);
    badge.style.setProperty("--c", color(a.status));
    const title = a.link ? el("a", { href: a.link, target: "_blank", rel: "noopener", textContent: a.title }) : a.title;
    const hist = (a.history || []).slice().reverse();
    const row = el("details", { className: "row" },
      el("summary", { style: "display:contents" },
        el("div", {}, el("div", { className: "co" }, a.company), el("div", { className: "muted" }, a.location || "")),
        el("div", {}, title),
        el("div", { className: "hide-m muted" }, a.platform || "—"),
        el("div", { className: "hide-m muted" }, fmt(a.applied_on)),
        badge),
      hist.length ? el("ul", { className: "hist" }, hist.map(h => el("li", {}, `${fmt(h.date)} — ${h.event}`))) : "");
    table.append(row);
  });
}

document.getElementById("q").addEventListener("input", e => { query = e.target.value; render(); });
</script>
</body>
</html>
